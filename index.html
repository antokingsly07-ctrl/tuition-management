<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Tuition Manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="bg-blobs" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <div class="login-card glass">
    <div class="login-logo">
      <div class="logo-icon">TM</div>
      <h1>Tuition Manager</h1>
      <p>Fees &amp; Attendance Management</p>
    </div>

    <form id="login-form" autocomplete="off">
      <label>Username
        <span class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>
        </span>
      </label>

      <label>Password
        <span class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="eye-btn" id="toggle-pass" aria-label="Show password" title="Show / hide password">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </span>
      </label>

      <div id="login-error" class="error-msg hidden"></div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <details class="login-hint">
      <summary>Demo accounts</summary>
      <div class="hint-rows">
        <div><span class="badge blue">Admin · both sections</span><code>admin / admin123</code></div>
        <div><span class="badge green">Tuition teacher</span><code>tuition / teach123</code></div>
        <div><span class="badge amber">Typewriting teacher</span><code>typewriting / teach123</code></div>
      </div>
    </details>
  </div>

  <script src="js/supabase-js.min.js?v=11"></script>
  <script src="js/supabase.js?v=11"></script>
  <script src="js/storage.js?v=11"></script>
  <script src="js/auth.js?v=11"></script>
  <script>
    const passInput = document.getElementById("password");
    const toggleBtn = document.getElementById("toggle-pass");
    toggleBtn.addEventListener("click", () => {
      const show = passInput.type === "password";
      passInput.type = show ? "text" : "password";
      toggleBtn.querySelector(".eye-open").classList.toggle("hidden", show);
      toggleBtn.querySelector(".eye-closed").classList.toggle("hidden", !show);
      toggleBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      passInput.focus();
    });
  </script>
</body>
</html>
